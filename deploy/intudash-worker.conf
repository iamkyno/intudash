; Supervisor config for the IntuDash queue worker.
; Copy to /etc/supervisor/conf.d/intudash-worker.conf then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start intudash-worker:*
;
; The worker processes SendCampaignJob (campaign sends) off the database queue.
; Two processes give headroom without overwhelming the SMS/SES providers.

[program:intudash-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/intudash/artisan queue:work --sleep=3 --tries=3 --timeout=320 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=330
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/intudash/storage/logs/worker.log
stopasgroup=true
killasgroup=true
